<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <script>
  document.documentElement.setAttribute("data-bs-theme",localStorage.getItem("theme") || "light");
</script>
  <link rel="icon" type="image/x-icon" href="./image/flying-money.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-body-tertiary">

  <div id="loading-overlay" class="d-none">
    <div class="spinner-border text-secondary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

      <nav class="navbar navbar-expand-lg bg-primary">
        <div class="container ">
            <a class="navbar-brand text-white fw-bold" href="#">Expense Tracker</a>
            <button id="themeToggle" type="button" class="btn btn-primary text-light fs-5"  aria-label="Toggle dark mode">
              <i class="bi bi-sun-fill "></i> 
            </button>
          </div>  
        
      </nav>

    <main class="container py-4">
      <div id="alert-container">

      </div>



      <div class="summary-card">
          <div class="card-box">
                <p class="card-text text-secondary mb-0">Total</p>
                <h3 class="card-text fw-bold" id="total-value">0.00</h3>
          </div>

          <div class="card-box">
                <p class="card-text text-secondary mb-0">Number of expenses</p>
                <h3 class="card-text fw-bold" id="expenses-number">0</h3>
          </div>

          <div class="card-box">
                <p class="card-text text-secondary mb-0">Highest expense</p>
                <h3 class="card-text fw-bold" id="highest-value">0.00</h3>
                <p class="card-text text-secondary" id="highest-name">expense name</p>
          </div>
        </div>



              <div class="card mt-4 form-card py-3 px-4">
                <div class="card-body">
                  <h5 class="card-title">Add Expense</h5>

                  <form class="row g-3 mt-2" id="add-form">
                    <div class="col-lg-3">
                      <label for="title" class="form-label">Title</label>
                      <input class="form-control" name="title" placeholder="Lunch" id="title">
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-lg-3">
                      <label for="amount" class="form-label">Amount</label>
                      <input type="number" class="form-control" name="amount" step="0.01" placeholder="4.50">
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-lg-3">
                      <label for="category" class="form-label">Category</label>
                      <select class="form-select" name="category">
                        <option selected>Choose...</option>
                      </select>
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-lg-3">
                      <label for="date" class="form-label">Date</label>
                      <input type="date" class="form-control" name="date">
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary" type="submit" id="add-expense">Add expense</button>
                    </div>
                  </form>

            </div>
        </div>
        

              <div class="card mt-4 py-3 px-4">
                <div class="card-body">
                  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <h5 class="card-title">Expense</h5>
                    
                    <div class="d-flex flex-wrap align-items-center gap-2">
                      <div class="search-box position-relative">
                        <input type="text" class="form-control form-control-sm pe-5" id="searchByTitle" placeholder="title...">
                        <i class="bi bi-search position-absolute top-50 translate-middle-y end-0 text-secondary"></i>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <label for="category-filter" class="form-label form-label-sm">Category</label>
                        <select class="form-select form-select-sm" id="category-filter">
                        <option selected>All</option>
                        </select>
                      </div>
                    </div>
                  </div>  
                  <div class="table-responsive">
                  <table class="table table-striped table-hover mt-2">
                    <thead>
                      <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Category</th>
                        <th scope="col">Date</th>
                        <th scope="col">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="expenses-table-body">
                      
                    </tbody>
                  </table>
                  </div>    

                </div>
              </div>

          <div class="modal fade" id="edit-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="staticBackdropLabel">Edit Form</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-form">
                    <div class="mb-3">
                      <label for="edit-title" class="form-label">Title</label>
                      <input class="form-control" name="title" placeholder="Lunch" id="edit-title">
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="amount" class="form-label">Amount</label>
                      <input type="number" class="form-control" name="amount" step="0.01" placeholder="4.50">
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="category" class="form-label">Category</label>
                      <select class="form-select" name="category">
                        <option selected>Choose...</option>
                      </select>
                      <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                      <label for="date" class="form-label">Date</label>
                      <input type="date" class="form-control" name="date">
                      <div class="invalid-feedback"></div>
                    </div>

                  </form>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-primary" id="save-edit-button">Save changes</button>
                </div>
              </div>
            </div>
          </div>

          <div class="modal fade" id="delete-modal">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p>Delete this expense?</p>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-danger" id="delete-button">Delete</button>
                </div>
              </div>
            </div>
          </div>
        </main>
      


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
